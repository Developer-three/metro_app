name: task_metro
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  qr_flutter: ^4.1.0
  google_nav_bar: ^5.0.7
  http: ^1.2.1
  sqflite: ^2.3.0
  path_provider: ^2.1.2
  intl: ^0.18.1
  cupertino_icons: ^1.0.8
  connectivity_plus: ^5.0.2
  flutter_native_splash: ^2.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0




# ✅ Place this block OUTSIDE of dependencies/dev_dependencies
flutter_icons:
  android: true
  ios: true
  image_path: "assets/upmrc.png"




flutter_native_splash:
  color: "#FFA500"  # Match this with your custom splash background color
  image: assets/Applogo.png
  image_dark: assets/Applogo.png
  fullscreen: true

  android_12:
    color: "#FFA500"
    image: assets/Applogo.png



flutter:
  uses-material-design: true
  assets:
    - assets/

